name: Retention cleanup

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.TRUTHFIT_PRODUCTION_DATABASE_URL }}
      TRUTHFIT_ENV: production
      TRUTHFIT_CLEANUP_ENABLED: "true"
      TRUTHFIT_RETENTION_DAYS: ${{ vars.TRUTHFIT_RETENTION_DAYS || '30' }}
      TRUTHFIT_PENDING_RETENTION_DAYS: ${{ vars.TRUTHFIT_PENDING_RETENTION_DAYS || '1' }}
      TRUTHFIT_FAILED_RETENTION_DAYS: ${{ vars.TRUTHFIT_FAILED_RETENTION_DAYS || '7' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.8"
          cache: pip
      - name: Explain missing deployment secret
        if: ${{ env.DATABASE_URL == '' }}
        run: echo "Skipping cleanup. Add TRUTHFIT_PRODUCTION_DATABASE_URL as a repository Actions secret."
      - name: Install dependencies
        if: ${{ env.DATABASE_URL != '' }}
        run: python -m pip install --requirement requirements.txt
      - name: Delete expired application data
        if: ${{ env.DATABASE_URL != '' }}
        run: python scripts/cleanup_expired_data.py
