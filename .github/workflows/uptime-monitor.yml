name: Uptime monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_HEALTH_URL: ${{ vars.TRUTHFIT_API_HEALTH_URL }}
      WEB_URL: ${{ vars.TRUTHFIT_WEB_URL }}
    steps:
      - name: Check configured endpoints
        shell: bash
        run: |
          if [[ -z "$API_HEALTH_URL" || -z "$WEB_URL" ]]; then
            echo "Skipping uptime checks. Configure TRUTHFIT_API_HEALTH_URL and TRUTHFIT_WEB_URL as repository Actions variables."
            exit 0
          fi
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 "$API_HEALTH_URL" | grep -q '"status":"ok"'
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 --output /dev/null "$WEB_URL"
